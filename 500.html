{% extends "base.html" %}
{% block title %}Server Error{% endblock %}
{% block content %}
<div style="min-height:60vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:4rem 1.5rem;">
  <div>
    <div style="font-size:5rem;margin-bottom:1rem;">⚙️</div>
    <h1 style="font-size:4rem;font-family:var(--font-head);font-weight:900;color:var(--terracotta);margin-bottom:0.5rem;">500</h1>
    <h2 style="font-size:1.25rem;margin-bottom:1rem;">Something Went Wrong</h2>
    <p style="color:var(--warm-gray);max-width:400px;margin:0 auto 2rem;">
      Our server encountered an error. Please try again or return to the homepage.
    </p>
    <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;">
      <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">Go Home</a>
      <button onclick="window.location.reload()" class="btn btn-outline btn-lg">Try Again</button>
    </div>
  </div>
</div>
{% endblock %}
