{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<div style="min-height:60vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:4rem 1.5rem;">
  <div>
    <div style="font-size:5rem;margin-bottom:1rem;">🔍</div>
    <h1 style="font-size:4rem;font-family:var(--font-head);font-weight:900;color:var(--dark-olive);margin-bottom:0.5rem;">404</h1>
    <h2 style="font-size:1.25rem;margin-bottom:1rem;">Page Not Found</h2>
    <p style="color:var(--warm-gray);max-width:400px;margin:0 auto 2rem;">
      The page you're looking for doesn't exist. It may have been moved or the item was claimed!
    </p>
    <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;">
      <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">Go Home</a>
      <a href="{{ url_for('marketplace') }}" class="btn btn-outline btn-lg">Browse Marketplace</a>
    </div>
  </div>
</div>
{% endblock %}
